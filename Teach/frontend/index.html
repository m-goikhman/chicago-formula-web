<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        (function () {
            try {
                var params = new URLSearchParams(location.search);
                var fromPortal = params.has('session_token') && params.has('participant_code');
                var fromStore = !!(localStorage.getItem('sessionToken') && localStorage.getItem('participantCode'));
                if (fromPortal || fromStore) {
                    document.documentElement.classList.add('auth-resume-pending');
                } else {
                    document.documentElement.classList.add('teach-login-visible');
                }
            } catch (e) { /* ignore */ }
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Chicago Formula</title>
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./shared/css/styles.css?v=20260520">
    <link rel="stylesheet" href="./shared/css/components.css">
    <link rel="stylesheet" href="css/teach.css?v=20260520-login-burger">
    <script src="./shared/js/auth-handoff.js?v=20260520"></script>
    <script src="./shared/js/portal-params.js?v=20260619"></script>
</head>
<body>
    <div class="container teach-container">
        <div class="header">
            <button class="burger-button" id="burgerButton" type="button">
                <div class="burger-icon">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </button>
            <div class="header-title-container">
                <h1>The Chicago Formula</h1>
                <div id="episodeSelector" class="episode-selector">
                    <span id="episodeDisplay" class="episode-display">Episode 1</span>
                    <div id="episodeDropdown" class="episode-dropdown" style="display: none;">
                        <!-- Week list will be populated here -->
                    </div>
                </div>
            </div>
        </div>
        <div class="progress-subband" style="display: none;">
            <span class="progress-subband-label">Overall progress</span>
            <div class="progress-subband-bar-bg">
                <div class="progress-subband-bar-fg" id="overallProgressBar"></div>
            </div>
            <span class="progress-subband-pct" id="overallProgressChip">0%</span>
        </div>

        <div id="loginScreen" class="login-screen">
            <h2>Welcome!</h2>
            <p>Enter your participant code to begin</p>
            <input type="text" id="participantCode" placeholder="Enter participant code (e.g., AN0842)" />
            <div class="login-button-row">
                <button id="loginBtn" type="button">Let's go!</button>
            </div>
            <div id="loginError" class="error"></div>
        </div>

        <div id="teachApp" class="teach-app">
            <div class="horizontal-menu" id="horizontalMenu">
                <div class="horizontal-menu-item" data-menu-action="language_menu_progress">
                    <div class="horizontal-menu-item-name">Progress Report</div>
                    <div class="horizontal-menu-item-description">View learning stats</div>
                </div>
                <div class="horizontal-menu-item" data-menu-action="help">
                    <div class="horizontal-menu-item-name">Help</div>
                    <div class="horizontal-menu-item-description">How to use Teach mode</div>
                </div>
                <div class="horizontal-menu-item" id="resetHistoryMenuItem" data-menu-action="reset_all_history" style="display: none;">
                    <div class="horizontal-menu-item-name">Reset All History</div>
                    <div class="horizontal-menu-item-description">Test only: clear all episode progress</div>
                </div>
                <div class="horizontal-menu-item" data-menu-action="logout">
                    <div class="horizontal-menu-item-name">Log Out</div>
                    <div class="horizontal-menu-item-description">Sign out and return to login</div>
                </div>
            </div>

            <div id="imageModalOverlay" class="image-modal-overlay" onclick="closeImageModal()">
                <button class="image-modal-close" onclick="closeImageModal()">✕</button>
                <img id="imageModalContent" class="image-modal-content" src="" alt="Full size image" onclick="event.stopPropagation()" loading="eager" />
            </div>

            <div class="main-chat-area teach-chat">
                <div class="chat-area" id="chatArea">
                    <div class="message bot">
                        <div class="message-content">
                            <div class="message-sender">Tutor</div>
                            <div class="message-text">Loading your episode materials…</div>
                        </div>
                    </div>
                </div>

                <div class="input-area" id="inputArea" style="display: none;">
                    <textarea id="messageInput" placeholder="Type your message..." rows="1" disabled></textarea>
                    <button id="sendBtn" disabled>Send</button>
                </div>
            </div>
        </div>
    </div>

    <script src="./shared/js/config.js?v=20251110"></script>
    <script src="js/config.js?v=20260506"></script>
    <script src="./shared/js/ui-shared.js?v=20251110"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.6/marked.min.js" crossorigin="anonymous"></script>
    <script src="./shared/js/highlights.js?v=20251110"></script>
    <script src="./shared/js/api-client.js?v=20251110"></script>
    <script src="./shared/js/auth-session.js?v=20260430"></script>
    <script src="./shared/js/auth-recovery.js?v=20260430"></script>
    <script src="./shared/js/explain-client.js?v=20260430"></script>
    <script src="js/auth.js?v=20251110"></script>
    <script src="js/state.js?v=20260511-cross-device-v2"></script>
    <script src="js/content-loader.js?v=20260506-exercise-classification-fix"></script>
    <script src="js/parsers/answer-key.js?v=20260504"></script>
    <script src="js/layout/week-selector.js?v=20260506"></script>
    <script src="js/layout/section-message.js?v=20260511-fill-weekid-v1"></script>
    <script src="js/layout/week-content.js?v=20260511-step-persist-v1"></script>
    <script src="js/ui/image-modal.js?v=20260430"></script>
    <script src="js/exercises/index.js?v=20260504"></script>
    <script src="js/ui.js?v=20260511-step-persist-v1"></script>
    <script src="js/explain.js?v=20251110"></script>
    <script src="js/open-ended-logger.js?v=20260511-drafts-v1"></script>
    <script src="js/app.js?v=20260511-cross-device-v2"></script>
</body>
</html>
