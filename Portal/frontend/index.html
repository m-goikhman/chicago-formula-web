<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Chicago Formula</title>
    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            const preview = (params.get('preview') || '').toLowerCase();
            const destination = preview === 'portal' ? './portal.html' : './placeholder/index.html';
            window.location.replace(destination);
        })();
    </script>
</head>
<body>
    <p>
        If you are not redirected automatically, open
        <a href="./placeholder/index.html">the placeholder page</a>
        or
        <a href="./portal.html">the portal preview</a>.
    </p>
</body>
</html>
