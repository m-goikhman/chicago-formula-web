<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Chicago Formula</title>
    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            const preview = (params.get('preview') || '').toLowerCase();
            const hasStudyParams = params.has('sona_id')
                || params.has('episode')
                || params.has('session_token')
                || params.has('participant_code');
            const usePortal = preview === 'portal' || hasStudyParams;
            const destination = usePortal ? './portal.html' : './placeholder/index.html';
            const suffix = usePortal ? (window.location.search || '') : '';
            window.location.replace(destination + suffix);
        })();
    </script>
</head>
<body>
    <p>
        If you are not redirected automatically, open
        <a href="./placeholder/index.html">the placeholder page</a>
        or
        <a href="./portal.html">the portal preview</a>.
    </p>
</body>
</html>
